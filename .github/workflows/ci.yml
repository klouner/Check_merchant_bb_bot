# CI: тесты и проверка сборки Docker-образа на каждый push и pull request.
#
# Автодеплой на свой сервер (необязательно, выключен по умолчанию).
# Settings → Secrets and variables → Actions:
#   Variables:  DEPLOY_ENABLED = true            — включает job deploy
#               DEPLOY_PATH    = /opt/merchant   — папка на сервере (по умолчанию ~/Check_merchant_bb_bot)
#   Secrets:    DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (приватный ключ), DEPLOY_PORT (необязательно, 22)
# На сервере нужны git и Docker с compose-плагином, а в папке деплоя — заполненный .env.
# Подробнее — README, раздел «Автодеплой через GitHub Actions».
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -q -r requirements.txt pytest
      - name: Compile
        run: python -m py_compile main.py checker.py database.py const.py app_config.py
      - name: Tests (офлайн, без реального Telegram/Bybit)
        run: python -m pytest -q tests

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t check_merchant_bb_bot:ci .

  deploy:
    needs: [test, docker]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ vars.DEPLOY_PATH }}"
            APP_DIR="${APP_DIR:-$HOME/Check_merchant_bb_bot}"
            REPO_URL="${{ github.server_url }}/${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch --prune origin
            # .env и data/ в .gitignore — reset их не трогает
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "!! Нет $APP_DIR/.env — скопируй .env.example в .env и впиши BOT_TOKEN"; exit 1
            fi

            docker compose up -d --build --remove-orphans
            docker image prune -f >/dev/null
            sleep 10
            # Только статус контейнера: логи бота содержат ники и ID пользователей,
            # а логи Actions в публичном репозитории видны всем.
            docker compose ps
            test "$(docker inspect -f '{{.State.Running}}' check_merchant_bb_bot)" = "true"
